name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Detect Android project
        id: detect
        shell: bash
        run: |
          set -e
          if [ -f "RankRush-source.zip" ]; then
            echo "Found RankRush-source.zip. Extracting..."
            mkdir -p extracted
            unzip -q RankRush-source.zip -d extracted

            GRADLEW_PATH=$(find extracted -name "gradlew" -type f | head -n 1)
            if [ -z "$GRADLEW_PATH" ]; then
              echo "No Android project found in zip"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          else
            if [ ! -f "gradlew" ]; then
              echo "No Android project found in repository root"
              exit 1
            fi
            PROJECT_DIR="."
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assemble${BUILD_TYPE^} --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"

      - name: Find built APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"
          APK_PATH=$(find . -name "*.apk" -type f | grep -E "release|debug" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RankRush-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          tag_name: build-${{ github.run_number }}
          body: |
            RankRush APK build completed successfully.
            APK: ${{ steps.apk.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
